      operationId: post_feedback
      summary: Independent problem feedback; separate optional contact permission, no subscription.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Feedback"
            example:
              category: passwords
              description: Finding the right account is difficult.
              followUp: false
              website: ""
      responses:
        "202":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
              example:
                success: true
                code: REQUEST_RECEIVED
                message: Your request has been received.
        "400":
