openapi: 3.1.0
info:
  title: 1Pass Marketing API
  version: 1.0.0
  description: "Development/sandbox contract. Strict JSON objects; unknown properties and query
    parameters rejected. ASCII email is lowercased without dot/plus rewriting. Plain text only:
    names reject URLs, HTML and controls; messages reject HTML and non-whitespace controls.
    Interests must be unique. Current server consent version is required. Form body limit 16 KiB;
    business 32 KiB. No vault identity or campaign APIs."
servers:
  - url: http://localhost:4000
    description: Development placeholder
